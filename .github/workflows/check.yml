name: VPN Gate Node Check
# 定时任务：每 4 小时运行一次（UTC 时间，北京时间同样是每4小时一次）
# 注意：GitHub 调度最小间隔约 5 分钟，但通常会延迟几分钟；仓库连续 60 天无提交会让定时任务自动停用。
#
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      max_nodes:
        description: '最多检测多少个节点（0 = 全部）'
        required: false
        default: '0'
      concurrency:
        description: '并发数（建议 32–64）'
        required: false
        default: '64'
      timeout:
        description: '单节点检测超时（秒）'
        required: false
        default: '30'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gate-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate worker secret
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          if [ -z "${DOMAIN}" ]; then
            echo "::error::未配置检测地址。请在仓库 Settings → Secrets and variables → Actions 中新增 Secret：DOMAIN（只填 Worker 的 host，例如 abc.workers.dev）"
            exit 1
          fi
          echo "检测域名已配置：${DOMAIN}"
      - name: Run pipeline
        env:
          CHECK_WORKER: "https://${{ secrets.DOMAIN }}/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: ${{ github.event.inputs.concurrency || '64' }}
          CHECK_TIMEOUT: ${{ github.event.inputs.timeout || '30' }}
          CHECK_DEADLINE: '2400'
          MAX_CHECK_NODES: ${{ github.event.inputs.max_nodes || '0' }}
          # 源变大后不再因成功率偏低而整批作废（低于该值则拒绝发布，保留上一次产物）
          MIN_SUCCESS_RATIO: '0.15'
          # 每国发布上限：住宅 / 其它（机房+未知）。调大避免像韩国那样 23 个被砍成 20 个
          MAX_RESIDENTIAL_PER_COUNTRY: '40'
          MAX_DATACENTER_PER_COUNTRY: '30'
          # 覆盖国家少于该值时在日志与 Summary 里告警（只告警不中断）
          MIN_COUNTRIES: '10'
          # 额外数据源：逗号分隔的 CSV/JSON 地址，会与官方 API、镜像一起合并去重
          # VPNGATE_EXTRA_SOURCES: 'https://example.com/vpngate.json'
        run: python vpngate.py
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "${api}")
          echo "GET ${api} -> ${status}"
          if [ "${status}" = "200" ]; then
            echo "GitHub Pages 已启用"
            exit 0
          fi
          if [ "${status}" = "404" ]; then
            # 创建站点必须用 POST，且 workflow 构建类型不接受 source 字段
            create=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' -X POST \
              "${auth[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "${api}")
            echo "POST ${api} -> ${create}"
            case "${create}" in
              201|204|409)
                echo "GitHub Pages 已启用（或已存在），等待生效"
                sleep 10
                exit 0
                ;;
              *)
                echo "::error::自动启用 Pages 失败（HTTP ${create}）。请打开仓库 Settings → Pages，把 Source 选为 GitHub Actions，然后重新运行本工作流。"
                cat /tmp/pages-create.json 2>/dev/null || true
                exit 1
                ;;
            esac
          fi
          echo "::error::查询 Pages 状态失败（HTTP ${status}），请检查仓库 Pages 设置或工作流权限。"
          cat /tmp/pages.json 2>/dev/null || true
          exit 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show site URL
        run: |
          echo "订阅地址：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "仪表盘：  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
